name: Docker publish

# Publishes the server image (Dockerfile, docs/deployment.md) to GHCR
# when a GitHub Release is published, the same trigger as release.yml. The two workflows run side by side and
# do not depend on each other: the Dockerfile builds the wheel from this checkout, not from PyPI, so the image
# does not wait for (or fail with) the PyPI publish.
#
# The image is built once (#140). `build` pushes it to GHCR by digest only, with no tag, so nobody pulls it by
# accident; `smoke` pulls that exact digest and checks it; `publish` then points the version tag (and `latest`)
# at the same digest without rebuilding. If `smoke` fails, the untagged image stays in GHCR as an untagged
# version and can be deleted from the package settings.
#
# Uses the built-in GITHUB_TOKEN, no stored secret. After the first push, set the package's visibility to
# public (Packages > py-tbparse > Package settings) if the image should be pullable without a login.
#
# Actions are pinned to commit SHAs (the tag is in the comment); Dependabot (.github/dependabot.yml) updates them.

on:
  release:
    types: [published]

env:
  IMAGE: ghcr.io/ddsna/py-tbparse

jobs:
  build:
    # Builds the image once and pushes it by digest, untagged.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write  # push the untagged image to ghcr.io with GITHUB_TOKEN
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Work out the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          project="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$version" != "$project" ]; then
            echo "Release tag $TAG does not match pyproject.toml version $project; the image would report $project." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        # Only the labels are used; the tags are set in `publish`, after the smoke test.
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=py-tbparse
            org.opencontainers.image.description=py-tbparse browser GUI in server mode
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push by digest (no tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Same attestation as the earlier tag pushes; it also makes the pushed digest an index, which
          # `imagetools create` in `publish` copies byte for byte.
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "No digest from the build step: '$DIGEST'" >&2; exit 1 ;; esac
          echo "Built and pushed $IMAGE@$DIGEST (untagged)" | tee -a "$GITHUB_STEP_SUMMARY"

  smoke:
    # Pulls the digest `build` pushed and checks it starts in server mode and answers /healthz. Pushes nothing.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read  # pull the untagged image
    env:
      REF: ghcr.io/ddsna/py-tbparse@${{ needs.build.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the built image by digest
        run: docker pull "$REF"

      - name: Start it in server mode and wait for /healthz
        run: |
          docker run -d --name tbparse -p 8080:8080 --read-only --tmpfs /tmp:size=64m \
            -e PY_TBPARSE_ALLOWED_HOSTS=tbparse.example.com "$REF"
          ok=
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/healthz; then ok=1; break; fi
            sleep 1
          done
          test -n "$ok"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' http://127.0.0.1:8080/)" = 403
          curl -fs -H 'Host: tbparse.example.com' http://127.0.0.1:8080/ -o /dev/null

      - name: Container log on failure
        if: failure()
        run: docker logs tbparse

  publish:
    # Tags the digest that `smoke` tested. Nothing is built here.
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    environment: release  # same environment name as the PyPI publish; no required-reviewer gate is configured, so this job runs without approval
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write  # add the tags on ghcr.io with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Work out the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Is this the highest release?
        # `latest` must not move back when a hotfix (0.5.2.post1) is published after 0.5.4 exists.
        # Compared with the other published, non-pre-release GitHub releases (scripts/is_highest_release.py).
        id: highest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,isDraft \
            --jq '.[] | select((.isPrerelease or .isDraft) | not) | .tagName' > releases.txt
          echo "value=$(python3 scripts/is_highest_release.py "$VERSION" < releases.txt)" >> "$GITHUB_OUTPUT"
          echo "Highest release: $(cat "$GITHUB_OUTPUT")"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested digest
        # With one source that is an index, `imagetools create` copies the manifest bytes unchanged, so the
        # tags point at exactly the digest `smoke` pulled. The check below fails the job if they do not.
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
          LATEST: ${{ !github.event.release.prerelease && steps.highest.outputs.value == 'true' }}
        run: |
          tags=("$VERSION")
          if [ "$LATEST" = true ]; then tags+=(latest); fi
          args=()
          for t in "${tags[@]}"; do args+=(--tag "$IMAGE:$t"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          for t in "${tags[@]}"; do
            got="$(docker buildx imagetools inspect "$IMAGE:$t" --format '{{json .Manifest}}' | jq -r .digest)"
            if [ "$got" != "$DIGEST" ]; then
              echo "$IMAGE:$t points at $got, not the tested $DIGEST" >&2
              exit 1
            fi
            echo "$IMAGE:$t -> $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          done
