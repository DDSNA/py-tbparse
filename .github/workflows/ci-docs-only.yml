name: CI (docs only)

# ci.yml ignores PRs that only change Markdown or README pictures, so such a PR would get no
# checks and a required `ci-ok` check would stay "expected" forever. This workflow reports a
# passing `ci-ok` for exactly that case. The paths here are the same list as the paths-ignore
# in ci.yml. They match when ANY file matches, so the job below checks that ALL files do.
#
# Two tests read Markdown files (tests/test_api_doc.py reads docs/api.md and runs its examples;
# tests/test_exit_codes.py reads the exit-code table in docs/cli.md), so a docs-only PR can break
# them. The doc-tests job runs just those, on one system. When a new test reads a .md file, add it
# to the list there (AGENTS.md, CI section).
on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**/*.png"

permissions:
  contents: read
  pull-requests: read

jobs:
  files:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          others=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' | grep -v -E '\.md$|^docs/.*\.png$' || true)
          if [ -z "$others" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Not docs-only, ci.yml runs the real checks for:"; echo "$others"
          fi

  doc-tests:
    needs: files
    if: needs.files.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Run the tests that read Markdown files
        run: pytest -q tests/test_api_doc.py tests/test_exit_codes.py

  ci-ok:
    # Same job name as in ci.yml. Skipped (counts as passing) when ci.yml runs for real.
    # always() so that a failed files or doc-tests job turns this red instead of skipping it:
    # a skipped required check would count as passing.
    needs: [files, doc-tests]
    if: always() && (needs.files.result != 'success' || needs.files.outputs.docs_only == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Docs-only PR, doc tests passed
        run: |
          echo "results: files=${{ needs.files.result }} doc-tests=${{ needs.doc-tests.result }}"
          test "${{ needs.files.result }}" = success
          test "${{ needs.doc-tests.result }}" = success
