name: Corpus

# Runs the tests that need the 200-workbook corpus (tests/corpus/manifest.csv), which is not stored in git.
# Not on pull requests: start it by hand (Actions > Corpus > Run workflow) or wait for the weekly run.
# See docs/development.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC

permissions:
  contents: read

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The key follows the manifest, so a changed manifest fetches again and an unchanged one never does.
      - name: Restore the corpus download
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tests/corpus/files
          key: corpus-${{ hashFiles('tests/corpus/manifest.csv') }}

      # About 200 blob requests to api.github.com through `gh` with the job's token (1000 an hour allowed).
      # fetch_corpus.py checks every file against the SHA-256 in the manifest and exits 1 if any fails.
      - name: Fetch the corpus
        run: python scripts/fetch_corpus.py
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install package with test extras
        run: pip install -e ".[test]"

      # A skip here means the corpus was not found, which would make the run meaningless: fail on any.
      - name: Run the corpus tests
        run: |
          set -o pipefail
          pytest -m corpus -q -rs -p no:cacheprovider | tee corpus-run.log
          if grep -q 'corpus not fetched' corpus-run.log; then echo "corpus tests were skipped"; exit 1; fi
        timeout-minutes: 45
