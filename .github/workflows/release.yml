name: Release

# Publishes to PyPI when a GitHub Release is published. Uses PyPI's
# "trusted publishing" (OIDC) -- no API token stored as a secret. Set
# this up once at https://pypi.org/manage/project/py-tbparse/settings/publishing/
# (or on first publish, per PyPI's trusted-publisher onboarding flow)
# pointing at this repo + the "release" environment + this workflow file.
#
# Actions are pinned to commit SHAs (the tag is in the comment); Dependabot (.github/dependabot.yml) updates them.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # to read the CI runs on the release commit
    steps:
      # First, before anything is built: the release commit must have a green run of the full CI workflow
      # (ci.yml: every OS and Python version, the browser tests, docker, build). The tests below run on
      # ubuntu and Python 3.12 only, so they cannot replace that. A release is a push-triggered run on the
      # tagged commit (main or a hotfix/** branch); a commit that was only ever in a PR has none and is refused.
      - name: CI must have passed on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          runs="$(gh api --paginate "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=100" \
            --jq '.workflow_runs[] | [.id, .status, (.conclusion // "none")] | @tsv')"
          echo "CI runs on $SHA (id, status, conclusion):"
          echo "${runs:-none}"
          if echo "$runs" | awk -F'\t' '$2 == "completed" && $3 == "success" {found=1} END {exit !found}'; then
            echo "CI passed on $SHA."
            exit 0
          fi
          {
            echo "Release $TAG is refused: no successful run of the CI workflow on commit $SHA."
            echo "Wait for or fix CI on that commit (look at the push run of its branch), then re-run this job,"
            echo "or delete the release and tag it again on a commit whose CI is green."
          } >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          project="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$version" != "$project" ]; then
            echo "Release tag $TAG does not match pyproject.toml version $project." >&2
            exit 1
          fi

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -q

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      # Pinned to the v1.14.2 release commit instead of the moving release/v1 branch (#140).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
