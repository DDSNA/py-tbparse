name: Release

# Publishes to PyPI when a GitHub Release is published. Uses PyPI's
# "trusted publishing" (OIDC) -- no API token stored as a secret. Set
# this up once at https://pypi.org/manage/project/twbparser-py/settings/publishing/
# (or on first publish, per PyPI's trusted-publisher onboarding flow)
# pointing at this repo + the "release" environment + this workflow file.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -q

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
