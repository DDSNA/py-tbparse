name: Release

# Publishes to PyPI when a GitHub Release is published. Uses PyPI's
# "trusted publishing" (OIDC) -- no API token stored as a secret. Set
# this up once at https://pypi.org/manage/project/py-tbparse/settings/publishing/
# (or on first publish, per PyPI's trusted-publisher onboarding flow)
# pointing at this repo + the "release" environment + this workflow file.
#
# Actions are pinned to commit SHAs (the tag is in the comment); Dependabot (.github/dependabot.yml) updates them.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          project="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$version" != "$project" ]; then
            echo "Release tag $TAG does not match pyproject.toml version $project." >&2
            exit 1
          fi

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -q

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      # Pinned to the v1.14.2 release commit instead of the moving release/v1 branch (#140).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
