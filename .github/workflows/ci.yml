name: CI

on:
  push:
    # hotfix/** : the commit a hotfix release is cut from needs the full run (AGENTS.md, Versioning).
    branches: [main, master, "hotfix/**"]
  # No branches filter: a PR runs for any base branch, including hotfix/**.
  pull_request:
    # A PR that only changes prose or the README pictures has nothing for the tests to see.
    # Pushes to main and hotfix/** always run everything.
    paths-ignore:
      - "**/*.md"
      - "docs/**/*.png"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # A PR gets the ends of the range on the two systems most people use; main gets all 20 combinations.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"ubuntu-24.04","python-version":"3.9"},{"os":"ubuntu-24.04","python-version":"3.13"},{"os":"windows-latest","python-version":"3.13"}]}' || '{"os":["ubuntu-24.04","macos-latest","windows-latest","ubuntu-24.04-arm"],"python-version":["3.9","3.10","3.11","3.12","3.13"]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          py-tbparse tests/fixtures/test_for_wenjie.twb tables
          py-tbparse tests/fixtures/test_for_wenjie.twb overview

  gui:
    # Drives the browser GUI in a real headless Chromium. The endpoint-level
    # tests can't see the page's JavaScript, so this is the only job that
    # would catch a broken <script>.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package with test + browser extras
        run: pip install -e ".[test,browser]"

      - name: Install Chromium and its system dependencies
        run: playwright install --with-deps chromium

      - name: Run browser GUI tests
        run: pytest -q tests/test_gui_*.py

  docker:
    # Builds the server image and drives it the way a TLS proxy would: forwarded Host, https Origin, cookie.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build image
        run: docker build -t py-tbparse:ci .

      - name: The image can read Excel data (openpyxl)
        run: docker run --rm --entrypoint python py-tbparse:ci -c "import openpyxl"

      - name: Run it read-only, as a proxy would reach it
        run: |
          docker run -d --name tbparse -p 8080:8080 --read-only --tmpfs /tmp:size=64m \
            -e PY_TBPARSE_ALLOWED_HOSTS=tbparse.example.com py-tbparse:ci
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:8080/healthz && break || sleep 1
          done

      - name: Healthy, host-checked, and an https upload works
        run: |
          curl -fs http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' http://127.0.0.1:8080/)" = 403
          curl -fs -c jar -H 'Host: tbparse.example.com' http://127.0.0.1:8080/ -o /dev/null
          curl -fs -b jar -H 'Host: tbparse.example.com' -H 'Origin: https://tbparse.example.com' \
            -H 'Content-Type: application/octet-stream' -H 'X-Filename: test_for_wenjie.twb' \
            --data-binary @tests/fixtures/test_for_wenjie.twb http://127.0.0.1:8080/upload | grep '"ok": true'
          curl -fs -b jar -H 'Host: tbparse.example.com' 'http://127.0.0.1:8080/table?name=datasources' | grep '"rows"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: tbparse.example.com' 'http://127.0.0.1:8080/table?name=datasources')" = 400

      - name: Stops promptly on SIGTERM
        run: |
          docker stop -t 5 tbparse
          test "$(docker inspect -f '{{.State.ExitCode}}' tbparse)" = 0

      - name: Container log on failure
        if: failure()
        run: docker logs tbparse

  build:
    runs-on: ubuntu-24.04
    needs: [test, gui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

      # ---- SBOM ----
      # Read from a fresh venv that holds only the built wheel and what it pulls in, so it lists what
      # `pip install py-tbparse` installs, not this job's build, twine and cyclonedx (#140). The venv has
      # no pip of its own (pip --python installs into it from outside), so pip is not listed either.
      - name: Install the wheel alone in a fresh venv
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/sbom-venv"
          pip --python "$RUNNER_TEMP/sbom-venv/bin/python" install dist/*.whl

      - name: Install CycloneDX
        run: pip install cyclonedx-bom

      - name: Generate SBOM
        run: |
          cyclonedx-py environment --pyproject pyproject.toml --mc-type library \
            --output-format JSON --output-file sbom.cdx.json "$RUNNER_TEMP/sbom-venv/bin/python"

      - name: The SBOM lists the runtime dependencies and no build tooling
        run: |
          python - <<'EOF'
          import json
          names = {c["name"].lower() for c in json.load(open("sbom.cdx.json")).get("components", [])}
          print("components:", ", ".join(sorted(names)))
          missing = {"lxml", "pandas"} - names
          tooling = names & {"build", "twine", "cyclonedx-bom", "pip", "setuptools", "wheel"}
          assert not missing, f"runtime dependencies missing from the SBOM: {sorted(missing)}"
          assert not tooling, f"build tooling in the SBOM: {sorted(tooling)}"
          EOF

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  ci-ok:
    # The one check to require in branch protection. Real PRs get it from here, after the jobs
    # above; a PR that only changes prose gets it from ci-docs-only.yml, because paths-ignore
    # above skips this whole workflow for such a PR (a skipped workflow reports nothing).
    if: always()
    needs: [test, gui, docker, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job succeeded
        run: |
          echo "results: ${{ join(needs.*.result, ' ') }}"
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
