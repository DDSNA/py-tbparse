name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # A PR that only changes prose or the README pictures has nothing for the tests to see.
    # Pushes to main always run everything.
    paths-ignore:
      - "**/*.md"
      - "docs/**/*.png"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # A PR gets the ends of the range on the two systems most people use; main gets all 20 combinations.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"ubuntu-latest","python-version":"3.9"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.13"}]}' || '{"os":["ubuntu-latest","macos-latest","windows-latest","ubuntu-24.04-arm"],"python-version":["3.9","3.10","3.11","3.12","3.13"]}') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          py-tbparse tests/fixtures/test_for_wenjie.twb tables
          py-tbparse tests/fixtures/test_for_wenjie.twb overview

  gui:
    # Drives the browser GUI in a real headless Chromium. The endpoint-level
    # tests can't see the page's JavaScript, so this is the only job that
    # would catch a broken <script>.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with test + browser extras
        run: pip install -e ".[test,browser]"

      - name: Install Chromium and its system dependencies
        run: playwright install --with-deps chromium

      - name: Run browser GUI tests
        run: pytest -q tests/test_gui_*.py

  docker:
    # Builds the server image and drives it the way a TLS proxy would: forwarded Host, https Origin, cookie.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t py-tbparse:ci .

      - name: Run it read-only, as a proxy would reach it
        run: |
          docker run -d --name tbparse -p 8080:8080 --read-only --tmpfs /tmp:size=64m \
            -e PY_TBPARSE_ALLOWED_HOSTS=tbparse.example.com py-tbparse:ci
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:8080/healthz && break || sleep 1
          done

      - name: Healthy, host-checked, and an https upload works
        run: |
          curl -fs http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' http://127.0.0.1:8080/)" = 403
          curl -fs -c jar -H 'Host: tbparse.example.com' http://127.0.0.1:8080/ -o /dev/null
          curl -fs -b jar -H 'Host: tbparse.example.com' -H 'Origin: https://tbparse.example.com' \
            -H 'Content-Type: application/octet-stream' -H 'X-Filename: test_for_wenjie.twb' \
            --data-binary @tests/fixtures/test_for_wenjie.twb http://127.0.0.1:8080/upload | grep '"ok": true'
          curl -fs -b jar -H 'Host: tbparse.example.com' 'http://127.0.0.1:8080/table?name=datasources' | grep '"rows"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: tbparse.example.com' 'http://127.0.0.1:8080/table?name=datasources')" = 400

      - name: Stops promptly on SIGTERM
        run: |
          docker stop -t 5 tbparse
          test "$(docker inspect -f '{{.State.ExitCode}}' tbparse)" = 0

      - name: Container log on failure
        if: failure()
        run: docker logs tbparse

  build:
    runs-on: ubuntu-latest
    needs: [test, gui]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

       # ---- SBOM ----
      - name: Install CycloneDX
        run: pip install cyclonedx-bom

      - name: Generate SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
