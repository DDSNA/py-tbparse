[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-tbparse"
version = "0.1.1a"
description = "Native Python port of the twbparser R package: parse Tableau .twb/.twbx workbooks into pandas DataFrames."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DDSNA" }]
keywords = ["tableau", "twb", "twbx", "workbook", "parser", "pandas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]
dependencies = [
    "lxml>=4.9",
    "pandas>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]
browser = ["playwright>=1.40"]
dev = ["build>=1.0", "twine>=5.0"]

[project.scripts]
twbparser = "twbparser_py.cli:main"
twbparser-gui = "twbparser_py.webgui:main"

[tool.setuptools.packages.find]
include = ["twbparser_py*"]

[tool.setuptools.package-data]
twbparser_py = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
