[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twbparser-py"
version = "0.1.0"
description = "Native Python port of the twbparser R package: parse Tableau .twb/.twbx workbooks into pandas DataFrames."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "lxml>=4.9",
    "pandas>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
twbparser = "twbparser_py.cli:main"
twbparser-gui = "twbparser_py.webgui:main"

[tool.setuptools.packages.find]
include = ["twbparser_py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
